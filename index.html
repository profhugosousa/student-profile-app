<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me Worksheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-stone-100 text-stone-800 font-sans min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto bg-white border-2 border-stone-800 p-8 shadow-[8px_8px_0px_0px_rgba(41,37,36,1)]">

        <header
            class="border-b-2 border-stone-800 pb-4 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h1 class="text-3xl font-black tracking-wider uppercase">About Me</h1>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <label for="studentName" class="font-bold uppercase text-sm">Name:</label>
                <input type="text" id="studentName" form="worksheetForm" required
                    class="border-b-2 border-stone-800 bg-transparent px-2 py-1 outline-none focus:border-indigo-600 flex-1 sm:w-64">
            </div>
        </header>

        <form id="worksheetForm" class="space-y-8">

            <!-- Hobbies and Presentation -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="border-2 border-stone-800 p-4 bg-stone-50">
                    <label for="hobbies" class="block font-bold mb-2">
                        What are your hobbies and interests?
                        <span class="block text-xs font-normal text-stone-600 mt-1">E.g., sports, music, reading, art,
                            social media, gaming, films, TV series, etc. Name at least 5.</span>
                    </label>
                    <textarea id="hobbies" rows="5" required
                        class="w-full p-2 border border-stone-400 focus:border-stone-800 outline-none resize-none bg-white"></textarea>
                </div>

                <div class="border-2 border-stone-800 p-4 bg-stone-50 relative">
                    <label for="presentation" class="block font-bold mb-2">
                        Imagine you are asked to give a presentation in class about something you are passionate about
                        or know very well.
                        <span class="block text-xs font-normal text-stone-600 mt-1">What would your presentation be
                            about? Why?</span>
                    </label>
                    <textarea id="presentation" rows="5" required
                        class="w-full p-2 border border-stone-400 focus:border-stone-800 outline-none resize-none bg-white"></textarea>
                </div>
            </div>

            <!-- Skills Wheel and Comments -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <div class="border-2 border-stone-800 p-4 bg-stone-50">
                    <h2 class="font-bold mb-2">Language Skills Assessment</h2>
                    <p class="text-xs text-stone-600 mb-4">Click on the chart or adjust the levels below (25%, 50%, 75%,
                        100%) based on how you feel about each right now.</p>

                    <div class="relative w-full aspect-square max-w-[320px] mx-auto mb-4">
                        <canvas id="wheelChart"></canvas>
                    </div>

                    <div id="wheelControls" class="grid grid-cols-2 gap-2 text-xs">
                        <!-- Dynamic Controls Injected by App.js -->
                    </div>
                </div>

                <div class="border-2 border-stone-800 p-4 bg-stone-50 h-full flex flex-col justify-between">
                    <div>
                        <label for="wheelComments" class="block font-bold mb-2">
                            Wheel Comments & Goals
                            <span class="block text-xs font-normal text-stone-600 mt-1">Add any comments about the wheel
                                you would like to share. What is one thing you would like to improve this year?</span>
                        </label>
                        <textarea id="wheelComments" rows="8" required
                            class="w-full p-2 border border-stone-400 focus:border-stone-800 outline-none resize-none bg-white"></textarea>
                    </div>
                </div>
            </div>

            <!-- Good English Lesson & 3 Words -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="border-2 border-stone-800 p-4 bg-stone-50 space-y-3">
                    <h2 class="font-bold">Describe a good English lesson according to you.</h2>

                    <div>
                        <label for="lessonInThis" class="block text-xs font-bold text-stone-700">In this
                            lesson...</label>
                        <input type="text" id="lessonInThis" required
                            class="w-full p-1.5 border border-stone-400 bg-white outline-none focus:border-stone-800">
                    </div>

                    <div>
                        <label for="lessonStudents" class="block text-xs font-bold text-stone-700">The
                            students...</label>
                        <input type="text" id="lessonStudents" required
                            class="w-full p-1.5 border border-stone-400 bg-white outline-none focus:border-stone-800">
                    </div>

                    <div>
                        <label for="lessonTeacher" class="block text-xs font-bold text-stone-700">The teacher...</label>
                        <input type="text" id="lessonTeacher" required
                            class="w-full p-1.5 border border-stone-400 bg-white outline-none focus:border-stone-800">
                    </div>
                </div>

                <div class="border-2 border-stone-800 p-4 bg-stone-50 flex flex-col justify-between">
                    <label for="threeWords" class="block font-bold mb-2">
                        Write 3 words you would like used to describe your English lessons at the end of the school
                        year.
                    </label>
                    <textarea id="threeWords" rows="4" required placeholder="1. ...&#10;2. ...&#10;3. ..."
                        class="w-full p-2 border border-stone-400 focus:border-stone-800 outline-none resize-none bg-white"></textarea>
                </div>
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" id="submitBtn"
                    class="bg-stone-800 text-white font-bold py-3 px-8 uppercase tracking-wider hover:bg-stone-700 transition-colors shadow-[4px_4px_0px_0px_rgba(120,113,108,1)] active:translate-x-0.5 active:translate-y-0.5">
                    Submit Worksheet
                </button>
            </div>
        </form>
    </div>

    <div id="statusModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div
            class="bg-white border-2 border-stone-800 p-6 max-w-sm w-full shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] text-center">
            <h3 id="modalTitle" class="text-xl font-black mb-2">Submitting...</h3>
            <p id="modalMessage" class="text-sm text-stone-600 mb-6">Please wait while your answers are saved.</p>
            <button id="modalCloseBtn"
                class="hidden bg-stone-800 text-white font-bold py-2 px-6 uppercase text-sm">Close</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
